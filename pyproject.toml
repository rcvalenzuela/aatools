
[project]
name = "aatools"
version = "0.0.1"
authors = [
  { name="Rene Valenzuela", email="rcvalenzuela@gmail.com" },
]
description = "Tools supporting advanced analytics workflows"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.sdist]
exclude = [
    "tests",
    "docs",
    "scripts",
    "examples",
    ".github",
    ".vscode",
    ".aa-venv"
]

[tool.hatch.build.targets.wheel]
exclude = [
    "tests",
    "docs",
    "scripts",
    "examples",
    ".github",
    ".vscode",
    ".aa-venv"
]
